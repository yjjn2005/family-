<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102c3b"><meta name="robots" content="noindex,nofollow"><title>부모님 병원 동행</title><link rel="stylesheet" href="./app.css"></head>
<body>
 <div class="shell">
  <header class="top"><div class="brand"><span class="brandmark">家</span><div><strong>부모님 병원 동행</strong><small>우리 가족의 일정과 기록</small></div></div><div class="topright"><span id="who"></span><button id="refresh" class="plain" hidden>새로고침</button><button id="logout" class="plain" hidden>잠금</button></div></header>
  <div id="app" hidden><section class="hero"><div><span class="eyebrow">FAMILY CARE · 2026</span><h1 id="heroTitle">다음 병원 가는 날</h1><p id="heroSubtitle"></p></div><div id="heroSide" class="hero-side"></div></section><nav class="tabs" aria-label="앱 메뉴"><button data-tab="schedule" class="active">병원가는날</button><button data-tab="turns">순번운영방식</button><button data-tab="hospitals">병원정보</button><button data-tab="records">병원기록</button><button data-tab="agreement">합의서</button></nav><main id="content"></main><footer>가족 공유 앱 · 병원 진료 및 약 변경은 진료기관의 안내를 확인하세요.</footer></div>
  <section id="login" class="login-wrap"><div class="login-card"><div class="login-icon">家</div><span class="eyebrow">FAMILY CARE</span><h1>부모님 병원 동행</h1><p>사남매가 같은 일정과 기록을 보려면 이름과 가족 PIN으로 들어오세요.</p><form id="loginForm"><label>이름<input id="loginName" autocomplete="name" placeholder="이름 입력" required></label><label>가족 PIN<input id="loginPin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="PIN 입력" required></label><button class="primary" type="submit">가족 앱 열기</button></form><p class="error" id="loginError" role="alert"></p><small>진료 기록과 사진은 로그인 후에만 열립니다.</small></div></section>
 </div><dialog id="editor"><form id="visitForm" method="dialog"><div class="modalhead"><h2 id="formTitle">병원 일정</h2><button type="button" id="closeDialog" class="iconbtn" aria-label="닫기">×</button></div><div class="fields"><label>날짜<input name="date" type="date" required></label><label>시간<input name="time" type="time"></label><label>병원<input name="hospital" list="hospitalOptions" required><datalist id="hospitalOptions"></datalist></label><label>누구의 진료인가요?<input name="patient" placeholder="어머니 / 아버지 / 부모님"></label><label class="wide">진료과·담당 의사·예약 내용<textarea name="detail" rows="2"></textarea></label><label class="wide">준비 및 확인 사항<textarea name="preparation" rows="2"></textarea></label><label>상태<select name="status"><option>예정</option><option>완료</option><option>취소</option></select></label><label>순번자 지정 또는 교환<select name="assignedOverride" id="assignedSelect"><option value="">기본 순번 자동 적용</option></select></label><label>실제 동행자<input name="actualAttendee" placeholder="예: 유연진 / 배우자 대리"></label><label>출발~귀가 시간(분)<input name="durationMinutes" type="number" min="0" max="1440" step="1"></label><label>22~06시 실제 대응(분)<input name="nightMinutes" type="number" min="0" max="1440" step="1"></label><label>교통·식대 등(원)<input name="transportCost" type="number" min="0" step="1000"></label><label class="check"><input name="emergency" type="checkbox"> 응급 대응</label><label class="wide">진료 결과·검사·약 변경<textarea name="notes" rows="3" placeholder="진료 내용, 검사 결과, 약 변경을 기록하세요."></textarea></label><label class="wide">다음 예약·할 일<textarea name="nextPlan" rows="2"></textarea></label><label class="wide" id="photoField">진료 결과 사진(5MB 이하)<input name="photo" type="file" accept="image/jpeg,image/png,image/webp"></label></div><p class="formhint">6시간 이상 또는 야간 실제 대응 2시간 이상 완료 시 2회로 표시됩니다. 두 명 이상 동행의 추가 인정은 가족이 별도 합의하세요.</p><p class="error" id="formError" role="alert"></p><div class="modalactions"><button type="button" id="deleteVisit" class="danger" hidden>일정 삭제</button><button type="submit" class="primary">저장하기</button></div></form></dialog><div id="toast" role="status" aria-live="polite"></div><script src="./app.js" defer></script>
</body></html>
